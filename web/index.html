<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HOMESYS — Home Alone?</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #c0c0c0;
      font-family: 'Tahoma', 'MS Sans Serif', Arial, sans-serif;
      font-size: 13px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 16px 48px;
    }

    .window {
      width: 100%;
      max-width: 490px;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      border-top:    2px solid #ffffff;
      border-left:   2px solid #ffffff;
      border-right:  2px solid #404040;
      border-bottom: 2px solid #404040;
      box-shadow: 1px 1px 0 #808080;
      background: #c0c0c0;
    }

    /* On small screens, fill almost the whole viewport */
    @media (max-width: 500px) {
      body { padding: 8px 8px 40px; justify-content: flex-start; }
      .window { min-height: calc(100dvh - 56px); }
    }

    .title-bar {
      background: linear-gradient(to right, #b84a00, #f0892a);
      padding: 5px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      flex-shrink: 0;
    }

    .title-bar-text {
      color: #ffffff;
      font-weight: bold;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .title-bar-controls { display: flex; gap: 2px; }

    .win-btn {
      width: 18px;
      height: 16px;
      background: #c0c0c0;
      border-top:    1px solid #ffffff;
      border-left:   1px solid #ffffff;
      border-right:  1px solid #404040;
      border-bottom: 1px solid #404040;
      font-size: 9px;
      line-height: 15px;
      text-align: center;
      cursor: default;
    }

    .window-body {
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 500px) {
      .window-body { padding: 16px; }
    }

    .panel {
      border-top:    2px solid #808080;
      border-left:   2px solid #808080;
      border-right:  2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      padding: 16px;
      margin-bottom: 20px;
    }

    .headline {
      font-size: 1.15rem;
      font-weight: bold;
      color: #b84a00;
      margin-bottom: 6px;
    }

    .subline { font-size: 11px; color: #444; }

    .btn {
      display: block;
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 10px;
      background: #c0c0c0;
      color: #000;
      border-top:    2px solid #ffffff;
      border-left:   2px solid #ffffff;
      border-right:  2px solid #404040;
      border-bottom: 2px solid #404040;
      font-family: 'Tahoma', Arial, sans-serif;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      outline: none;
      /* Larger touch target on mobile */
      min-height: 44px;
    }

    .btn:hover  { background: #d4d4d4; }
    .btn:active {
      border-top:    2px solid #404040;
      border-left:   2px solid #404040;
      border-right:  2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      padding: 11px 13px 9px 15px;
    }

    .back-btn {
      padding: 6px 12px;
      margin-bottom: 16px;
      background: #c0c0c0;
      color: #000;
      border-top:    2px solid #ffffff;
      border-left:   2px solid #ffffff;
      border-right:  2px solid #404040;
      border-bottom: 2px solid #404040;
      font-family: 'Tahoma', Arial, sans-serif;
      font-size: 12px;
      cursor: pointer;
      outline: none;
      min-height: 36px;
    }
    .back-btn:active {
      border-top:    2px solid #404040;
      border-left:   2px solid #404040;
      border-right:  2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
    }

    .section-label {
      font-size: 11px;
      color: #b84a00;
      font-weight: bold;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
    }

    @media (max-width: 400px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    .card {
      background: #c0c0c0;
      border-top:    1px solid #ffffff;
      border-left:   1px solid #ffffff;
      border-right:  1px solid #404040;
      border-bottom: 1px solid #404040;
      padding: 12px 10px;
      text-align: center;
    }

    .card-name { font-weight: bold; font-size: 13px; margin-bottom: 6px; }
    .card-status { font-size: 12px; }
    .is-home { color: #2ba556; }
    .is-away { color: #808080; }

    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
    .dot-home { background: #2ba556; }
    .dot-away { background: #aaaaaa; }

    .health-box {
      border-top:    2px solid #808080;
      border-left:   2px solid #808080;
      border-right:  2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      padding: 24px;
      font-size: 12px;
      color: #444;
      text-align: center;
    }

    .status-bar {
      border-top: 1px solid #808080;
      padding: 3px 8px;
      font-size: 11px;
      color: #444;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .status-panel {
      border-top:    1px solid #808080;
      border-left:   1px solid #808080;
      border-right:  1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
      padding: 1px 6px;
    }

    .taskbar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 32px;
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      display: flex;
      align-items: center;
      padding: 0 4px;
    }

    .start-btn {
      height: 24px;
      padding: 0 10px;
      background: #c0c0c0;
      border-top:    2px solid #ffffff;
      border-left:   2px solid #ffffff;
      border-right:  2px solid #404040;
      border-bottom: 2px solid #404040;
      font-family: 'Tahoma', Arial, sans-serif;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .taskbar-clock {
      margin-left: auto;
      border-top:    1px solid #808080;
      border-left:   1px solid #808080;
      border-right:  1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
      padding: 2px 8px;
      font-size: 11px;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">🏠 HOMESYS — Home Alone?</div>
      <div class="title-bar-controls">
        <div class="win-btn">_</div>
        <div class="win-btn">□</div>
        <div class="win-btn">✕</div>
      </div>
    </div>

    <div class="window-body">

      <div id="view-landing">
        <div class="panel">
          <div class="headline">Are you home alone?</div>
          <div class="subline">This service provides live information about which roommates are home right now.</div>
        </div>
        <button class="btn" onclick="showView('who')">🏠&nbsp; See who's home right now</button>
        <button class="btn" onclick="showView('health')">📊&nbsp; Health dashboard</button>
      </div>

      <div id="view-who" class="hidden">
        <button class="back-btn" onclick="showView('landing')">◀ Back</button>
        <div class="section-label">Roommate status:</div>
        <div class="grid" id="grid"></div>
      </div>

      <div id="view-health" class="hidden">
        <button class="back-btn" onclick="showView('landing')">◀ Back</button>
        <div class="section-label">📊 System health</div>
        <div class="health-box">Under construction...</div>
      </div>

    </div>

    <div class="status-bar">
      <div class="status-panel" id="status-text">Ready</div>
      <div class="status-panel" id="clock"></div>
    </div>
  </div>

  <div class="taskbar">
    <button class="start-btn">⊞ Start</button>
    <div class="taskbar-clock" id="taskbar-clock"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, signInAnonymously }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    function tick() {
      const t = new Date().toTimeString().slice(0, 5);
      document.getElementById("clock").textContent = t;
      document.getElementById("taskbar-clock").textContent = t;
    }
    tick(); setInterval(tick, 1000);

    window.showView = id => {
      ["landing", "who", "health"].forEach(v =>
        document.getElementById("view-" + v).classList.toggle("hidden", v !== id)
      );
      const labels = { landing: "Ready", who: "Occupancy status", health: "System health" };
      document.getElementById("status-text").textContent = labels[id];
    };

    const app = initializeApp({
      apiKey:     "AIzaSyAdIdYyveAd8W8yFg1N2jlapRjlPLjWCBw",
      authDomain: "home-alone-e5e32.firebaseapp.com",
      projectId:  "home-alone-e5e32",
    });

    await signInAnonymously(getAuth(app));

    onSnapshot(collection(getFirestore(app), "roommates"), snap => {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      snap.docs.sort((a, b) => a.id.localeCompare(b.id)).forEach(doc => {
        const home = doc.data().isHome;
        grid.innerHTML += `
          <div class="card">
            <div class="card-name">${doc.id}</div>
            <div class="card-status ${home ? "is-home" : "is-away"}">
              <span class="dot ${home ? "dot-home" : "dot-away"}"></span>${home ? "Home" : "Away"}
            </div>
          </div>`;
      });
    });
  </script>
</body>
</html>
