<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HOMESYS — Page Not Found</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #c0c0c0;
      font-family: 'Tahoma', 'MS Sans Serif', Arial, sans-serif;
      font-size: 13px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 16px 48px;
    }

    .window {
      width: 100%;
      max-width: 490px;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      border-top:    2px solid #ffffff;
      border-left:   2px solid #ffffff;
      border-right:  2px solid #404040;
      border-bottom: 2px solid #404040;
      box-shadow: 1px 1px 0 #808080;
      background: #c0c0c0;
    }

    @media (max-width: 500px) {
      body { padding: 8px 8px 40px; justify-content: flex-start; }
      .window { min-height: calc(100dvh - 56px); }
    }

    .title-bar {
      background: linear-gradient(to right, #b84a00, #f0892a);
      padding: 5px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      flex-shrink: 0;
    }

    .title-bar-text {
      color: #ffffff;
      font-weight: bold;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .title-bar-controls { display: flex; gap: 2px; }

    .win-btn {
      width: 18px;
      height: 16px;
      background: #c0c0c0;
      border-top:    1px solid #ffffff;
      border-left:   1px solid #ffffff;
      border-right:  1px solid #404040;
      border-bottom: 1px solid #404040;
      font-size: 9px;
      line-height: 15px;
      text-align: center;
      cursor: default;
    }

    .window-body {
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    @media (max-width: 500px) {
      .window-body { padding: 16px; }
    }

    .panel {
      border-top:    2px solid #808080;
      border-left:   2px solid #808080;
      border-right:  2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      padding: 16px;
      margin-bottom: 20px;
    }

    .headline {
      font-size: 1.15rem;
      font-weight: bold;
      color: #b84a00;
      margin-bottom: 6px;
    }

    .subline { font-size: 11px; color: #444; }

    .error-code {
      font-size: 2rem;
      font-weight: bold;
      color: #b84a00;
      margin-bottom: 12px;
    }

    .btn {
      display: block;
      width: 100%;
      max-width: 200px;
      padding: 10px 14px;
      margin-top: 20px;
      background: #c0c0c0;
      color: #000;
      border-top:    2px solid #ffffff;
      border-left:   2px solid #ffffff;
      border-right:  2px solid #404040;
      border-bottom: 2px solid #404040;
      font-family: 'Tahoma', Arial, sans-serif;
      font-size: 14px;
      text-align: center;
      cursor: pointer;
      outline: none;
      min-height: 44px;
      text-decoration: none;
    }

    .btn:hover  { background: #d4d4d4; }
    .btn:active {
      border-top:    2px solid #404040;
      border-left:   2px solid #404040;
      border-right:  2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      padding: 11px 13px 9px 15px;
    }

    .status-bar {
      border-top: 1px solid #808080;
      padding: 3px 8px;
      font-size: 11px;
      color: #444;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .status-panel {
      border-top:    1px solid #808080;
      border-left:   1px solid #808080;
      border-right:  1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
      padding: 1px 6px;
    }

    .taskbar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 32px;
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      display: flex;
      align-items: center;
      padding: 0 4px;
    }

    .start-btn {
      height: 24px;
      padding: 0 10px;
      background: #c0c0c0;
      border-top:    2px solid #ffffff;
      border-left:   2px solid #ffffff;
      border-right:  2px solid #404040;
      border-bottom: 2px solid #404040;
      font-family: 'Tahoma', Arial, sans-serif;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .taskbar-clock {
      margin-left: auto;
      border-top:    1px solid #808080;
      border-left:   1px solid #808080;
      border-right:  1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
      padding: 2px 8px;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">🏠 HOMESYS — Error</div>
      <div class="title-bar-controls">
        <div class="win-btn">_</div>
        <div class="win-btn">□</div>
        <div class="win-btn">✕</div>
      </div>
    </div>

    <div class="window-body">
      <div class="error-code">404</div>
      <div class="panel">
        <div class="headline">Page Not Found</div>
        <div class="subline">The specified file was not found on this website. Please check the URL for mistakes and try again.</div>
      </div>
      <a href="/" class="btn">🏠 Back to home</a>
    </div>

    <div class="status-bar">
      <div class="status-panel">Error 404 — File not found</div>
      <div class="status-panel" id="taskbar-clock"></div>
    </div>
  </div>

  <div class="taskbar">
    <button class="start-btn">⊞ Start</button>
    <div class="taskbar-clock" id="taskbar-clock-bottom"></div>
  </div>

  <script>
    function tick() {
      const t = new Date().toTimeString().slice(0, 5);
      document.getElementById("taskbar-clock").textContent = t;
      document.getElementById("taskbar-clock-bottom").textContent = t;
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
